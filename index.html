<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub AI 热点监控</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1410;
    --paper: #fefcf8;
    --warm-white: #faf6f0;
    --border: #e8e0d5;
    --muted: #8b7e6e;
    --accent: #d4453b;
    --gold: #c7943c;
    --teal: #1a6b5e;
    --water-bg: #eaf2f4;
    --water-border: #bcd4db;
    --water-text: #1e4a5f;
    --card-shadow: 0 1px 3px rgba(28,20,16,0.04), 0 1px 2px rgba(28,20,16,0.03);
    --card-hover-shadow: 0 4px 16px rgba(28,20,16,0.08), 0 2px 4px rgba(28,20,16,0.04);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'DM Sans', 'Noto Sans SC', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Typography */
  .display-font {
    font-family: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
    letter-spacing: -0.01em;
  }

  /* Cards */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: all 0.25s ease;
    box-shadow: var(--card-shadow);
  }
  .card:hover {
    border-color: #d4c8b4;
    box-shadow: var(--card-hover-shadow);
  }

  /* Skeleton loading */
  .skeleton {
    animation: shimmer 1.8s infinite;
    background: linear-gradient(90deg, #ece6dc 25%, #f0ebe2 50%, #ece6dc 75%);
    background-size: 200% 100%;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* Animations */
  .fade-in {
    animation: slideUp 0.5s ease forwards;
    opacity: 0;
    transform: translateY(12px);
  }
  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .stagger-1 { animation-delay: 0.05s; }
  .stagger-2 { animation-delay: 0.10s; }
  .stagger-3 { animation-delay: 0.15s; }
  .stagger-4 { animation-delay: 0.20s; }
  .stagger-5 { animation-delay: 0.25s; }
  .stagger-6 { animation-delay: 0.30s; }
  .stagger-7 { animation-delay: 0.35s; }
  .stagger-8 { animation-delay: 0.40s; }
  .stagger-9 { animation-delay: 0.45s; }
  .stagger-10 { animation-delay: 0.50s; }

  /* Tab */
  .tab-active {
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    font-weight: 500;
  }
  .tab-inactive {
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
  }
  .tab-inactive:hover {
    background: #f0ebe2;
    color: var(--ink);
  }

  /* Badges */
  .treasure-badge {
    background: linear-gradient(135deg, #e8a020, #d4453b);
    color: #fff;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  /* Gradient text for scores */
  .score-text {
    background: linear-gradient(135deg, #d4453b, #c7943c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Headline card */
  .headline-card {
    background: var(--ink);
    color: #f0e6d8;
    border: 1px solid #3a3028;
    border-radius: 12px;
  }
  .headline-card:hover {
    border-color: #5a4e42;
    box-shadow: 0 8px 32px rgba(28,20,16,0.25);
  }

  /* Dark horse card */
  .darkhorse-card {
    background: #fef9f0;
    border: 1px solid #ebd8b8;
  }

  /* Water section */
  .water-section {
    background: var(--water-bg);
    border: 1px solid var(--water-border);
    border-radius: 14px;
  }

  /* Rank number */
  .rank-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .rank-1 { background: #d4453b; color: #fff; }
  .rank-2 { background: #c7943c; color: #fff; }
  .rank-3 { background: #8b6d4a; color: #fff; }
  .rank-rest { background: #f0ebe2; color: #8b7e6e; }

  /* Trend chip */
  .trend-chip {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 0.8rem;
    color: var(--ink);
    transition: all 0.2s;
  }
  .trend-chip:hover {
    border-color: #c7943c;
    background: #fef9f0;
  }

  /* Link hover */
  .hover-link { transition: color 0.15s; }
  .hover-link:hover { color: #d4453b; }

  /* Subtle divider */
  .hairline { border-top: 1px solid var(--border); }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .headline-card { border-radius: 10px; }
    .water-section { border-radius: 10px; }
  }
</style>
</head>
<body class="min-h-screen">

<!-- Header -->
<header class="border-b bg-white/90 backdrop-blur sticky top-0 z-50" style="border-color: var(--border);">
  <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between flex-wrap gap-3">
    <div>
      <h1 class="text-xl display-font tracking-tight" style="color: var(--ink);">
        GitHub AI <span style="color: var(--accent);">热点</span>监控
      </h1>
      <p class="text-xs mt-0.5" style="color: var(--muted);" id="updateTime">加载中...</p>
    </div>
    <div class="flex gap-1 p-0.5 rounded-lg" style="background: #f0ebe2;">
      <button onclick="switchTab('daily')" id="tab-daily" class="tab-active px-4 py-2 text-sm transition-all duration-200">
        今日最热
      </button>
      <button onclick="switchTab('weekly')" id="tab-weekly" class="tab-inactive px-4 py-2 text-sm transition-all duration-200">
        一周最热
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-5 py-8 space-y-10">

<!-- ============================================ -->
<!-- Section 1: AI Insights                        -->
<!-- ============================================ -->
<section id="insightsSection">
  <div class="flex items-center gap-3 mb-5">
    <span class="text-xl">🤖</span>
    <h2 class="text-lg font-semibold display-font tracking-tight">AI 洞察</h2>
  </div>

  <!-- Headline + Dark Horses grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-5" id="insightsGrid">
    <!-- Headline (spans 2) -->
    <div class="lg:col-span-2">
      <div class="headline-card p-6" id="headlineCard">
        <div class="skeleton h-4 w-20 mb-4"></div>
        <div class="skeleton h-7 w-3/4 mb-3"></div>
        <div class="skeleton h-4 w-full mb-2"></div>
        <div class="skeleton h-4 w-2/3"></div>
      </div>
    </div>
    <!-- Dark Horses (spans 1) -->
    <div>
      <div class="card darkhorse-card p-5 h-full" id="darkHorseCard">
        <div class="skeleton h-4 w-16 mb-4"></div>
        <div class="space-y-3">
          <div class="skeleton h-12 w-full"></div>
          <div class="skeleton h-12 w-full"></div>
          <div class="skeleton h-12 w-full"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Trend Signals -->
  <div class="mt-4 flex flex-wrap gap-2" id="trendSignals">
    <div class="skeleton h-7 w-40 rounded-full"></div>
    <div class="skeleton h-7 w-52 rounded-full"></div>
    <div class="skeleton h-7 w-36 rounded-full"></div>
  </div>
</section>

<!-- ============================================ -->
<!-- Section 2: Project Hot List                   -->
<!-- ============================================ -->
<section>
  <div class="flex items-center justify-between mb-5">
    <h2 class="text-lg font-semibold display-font tracking-tight" id="listTitle">🔥 今日热榜</h2>
    <span class="text-xs" style="color: var(--muted);">按综合热度排序</span>
  </div>

  <div class="space-y-3" id="projectList">
    <!-- Skeleton loading -->
    <div class="card p-5"><div class="flex items-start gap-4"><div class="skeleton w-8 h-8 rounded-full shrink-0"></div><div class="flex-1"><div class="skeleton h-5 w-2/3 mb-2"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-1/2"></div></div></div></div>
    <div class="card p-5"><div class="flex items-start gap-4"><div class="skeleton w-8 h-8 rounded-full shrink-0"></div><div class="flex-1"><div class="skeleton h-5 w-3/4 mb-2"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-2/3"></div></div></div></div>
    <div class="card p-5"><div class="flex items-start gap-4"><div class="skeleton w-8 h-8 rounded-full shrink-0"></div><div class="flex-1"><div class="skeleton h-5 w-1/2 mb-2"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-3/4"></div></div></div></div>
    <div class="card p-5"><div class="flex items-start gap-4"><div class="skeleton w-8 h-8 rounded-full shrink-0"></div><div class="flex-1"><div class="skeleton h-5 w-2/3 mb-2"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-1/2"></div></div></div></div>
    <div class="card p-5"><div class="flex items-start gap-4"><div class="skeleton w-8 h-8 rounded-full shrink-0"></div><div class="flex-1"><div class="skeleton h-5 w-3/5 mb-2"></div><div class="skeleton h-3 w-full mb-2"></div><div class="skeleton h-3 w-2/3"></div></div></div></div>
  </div>
</section>

<!-- ============================================ -->
<!-- Section 3: Water Insights                    -->
<!-- ============================================ -->
<section>
  <div class="water-section p-6" id="waterSection">
    <div class="flex items-center gap-3 mb-4">
      <span class="text-xl">🌊</span>
      <h2 class="text-lg font-semibold display-font tracking-tight" style="color: var(--water-text);">水利行业参考</h2>
    </div>
    <p class="text-sm mb-5 leading-relaxed" style="color: #3a7a95;" id="waterSummary">
      <span class="skeleton inline-block h-4 w-3/4"></span>
    </p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="waterRecommendations">
      <div class="card p-4" style="background: rgba(255,255,255,0.6);">
        <div class="skeleton h-5 w-32 mb-2"></div>
        <div class="skeleton h-4 w-full mb-2"></div>
        <div class="skeleton h-4 w-2/3"></div>
      </div>
      <div class="card p-4" style="background: rgba(255,255,255,0.6);">
        <div class="skeleton h-5 w-32 mb-2"></div>
        <div class="skeleton h-4 w-full mb-2"></div>
        <div class="skeleton h-4 w-2/3"></div>
      </div>
    </div>
  </div>
</section>

</main>

<script>
// ── State ──
let currentMode = 'daily';
let projectData = null;
let insightsData = null;
let waterData = null;
let metaData = null;

// ── Data Fetching ──
async function loadData(mode) {
  try {
    const [projResp, insResp, waterResp, metaResp] = await Promise.all([
      fetch(`data/${mode === 'daily' ? 'today' : 'week'}.json`),
      fetch('data/insights.json'),
      fetch('data/water_insights.json'),
      fetch('data/meta.json')
    ]);
    projectData = await projResp.json();
    insightsData = await insResp.json();
    waterData = await waterResp.json();
    metaData = await metaResp.json();
    return true;
  } catch (e) {
    console.error('Data load error:', e);
    return false;
  }
}

// ── Tab Switching ──
async function switchTab(mode) {
  if (currentMode === mode) return;
  currentMode = mode;
  document.getElementById('tab-daily').className = mode === 'daily' ? 'tab-active px-4 py-2 text-sm transition-all duration-200' : 'tab-inactive px-4 py-2 text-sm transition-all duration-200';
  document.getElementById('tab-weekly').className = mode === 'weekly' ? 'tab-active px-4 py-2 text-sm transition-all duration-200' : 'tab-inactive px-4 py-2 text-sm transition-all duration-200';
  document.getElementById('listTitle').innerHTML = mode === 'daily' ? '&#128293; 今日热榜' : '&#128200; 本周热榜';
  showSkeletons();
  await loadData(mode);
  renderAll();
}

// ── Render ──
function showSkeletons() {}

function renderAll() {
  renderMeta();
  renderInsights();
  renderProjectList();
  renderWaterInsights();
}

function renderMeta() {
  const el = document.getElementById('updateTime');
  if (metaData && metaData.last_updated) {
    const d = new Date(metaData.last_updated);
    el.textContent = `更新于 ${d.toLocaleString('zh-CN')}  ·  共 ${metaData.total_ai_projects || '?'} 个 AI 项目`;
  }
}

// ── Insights Rendering ──
function renderInsights() {
  if (!insightsData) return;

  // Headline
  const hl = insightsData.headline;
  const hlCard = document.getElementById('headlineCard');
  if (hl && hl.project) {
    const p = hl.project;
    const isTreasure = p.is_treasure ? '<span class="treasure-badge text-xs px-2 py-0.5 rounded-full ml-2">宝藏</span>' : '';
    hlCard.innerHTML = `
      <div class="flex items-center gap-2 mb-3">
        <span class="text-xs font-semibold tracking-wide uppercase" style="color: #d4453b;">Today's Headline</span>
        ${isTreasure}
      </div>
      <a href="${escHtml(p.url)}" target="_blank" class="text-2xl display-font text-white hover-link block mb-3" style="color: #f0e6d8;">
        ${escHtml(p.name)}
      </a>
      <p class="text-sm mb-3 leading-relaxed" style="color: #b8a898;">${escHtml(p.description || '')}</p>
      <div class="flex flex-wrap items-center gap-4 text-xs" style="color: #8b7a68;">
        <span>${fmtNum(p.stars)}${p.stars_added ? ` <span style="color: #4ec49b;">+${p.stars_added}</span>` : ''} stars</span>
        <span>Heat ${p.heat_score}</span>
        <span>${escHtml(p.language || '')}</span>
      </div>
      <p class="mt-3 text-sm italic" style="color: #8b7a68;">${escHtml(hl.why_hot || '')}</p>
    `;
  }

  // Dark Horses
  const dhCard = document.getElementById('darkHorseCard');
  const dhs = insightsData.dark_horses || [];
  if (dhCard && dhs.length > 0) {
    let html = '<h3 class="text-sm font-semibold mb-3 display-font" style="color: #c7943c;">Dark Horses</h3>';
    dhs.forEach(dh => {
      const p = dh.project;
      html += `
        <a href="${escHtml(p.url)}" target="_blank" class="block mb-2.5 p-3 rounded-lg transition-all duration-200" style="background: rgba(199,148,60,0.05);" onmouseover="this.style.background='rgba(199,148,60,0.12)'" onmouseout="this.style.background='rgba(199,148,60,0.05)'">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold" style="color: var(--ink);">${escHtml(p.name)}</span>
            <span class="text-xs font-medium" style="color: var(--gold);">${fmtNum(p.stars)} stars</span>
          </div>
          <p class="text-xs mt-1 truncate" style="color: var(--muted);">${escHtml(p.description || '')}</p>
          <div class="text-xs mt-1.5 font-medium" style="color: #c7943c;">Buzz ${Math.round(dh.community_heat)}</div>
        </a>
      `;
    });
    dhCard.innerHTML = html;
  } else if (dhCard) {
    dhCard.innerHTML = '<h3 class="text-sm font-semibold mb-2 display-font" style="color: #c7943c;">Dark Horses</h3><p class="text-sm" style="color: var(--muted);">暂无符合条件的宝藏项目</p>';
  }

  // Trend Signals
  const trendsEl = document.getElementById('trendSignals');
  const trends = insightsData.trend_signals || [];
  if (trendsEl && trends.length > 0) {
    const icons = ['🤖', '📚', '⚡'];
    trendsEl.innerHTML = trends.map((t, i) => {
      return `<span class="trend-chip">
        ${icons[i] || '📊'} <strong>${escHtml(t.trend)}</strong><span class="hidden sm:inline"> — ${escHtml(t.description)}</span>
      </span>`;
    }).join('');
  }
}

// ── Project List Rendering ──
function renderProjectList() {
  const container = document.getElementById('projectList');
  if (!projectData || !projectData.projects || projectData.projects.length === 0) {
    container.innerHTML = '<div class="card p-10 text-center" style="color: var(--muted);">暂无数据，请稍后刷新</div>';
    return;
  }

  container.innerHTML = projectData.projects.map((p, i) => {
    const scores = p.scores || {};
    const isTreasure = scores.is_treasure;
    const rankClass = i === 0 ? 'rank-1' : (i === 1 ? 'rank-2' : (i === 2 ? 'rank-3' : 'rank-rest'));
    const stagger = `stagger-${Math.min(i + 1, 10)}`;

    // Stats
    let statsParts = [];
    if (p.stars_added) statsParts.push(`<span style="color:#1a6b5e;font-weight:500;">+${fmtNum(p.stars_added)} today</span>`);
    if (p.stars) statsParts.push(`${fmtNum(p.stars)} total stars`);
    if (p.hn_score || p.hn_points) statsParts.push(`<span style="color:#d4453b;">HN ${fmtNum(p.hn_score || p.hn_points)}</span>`);
    if (p.reddit_ups) statsParts.push(`<span style="color:#c7943c;">Reddit ${fmtNum(p.reddit_ups)}</span>`);
    const statsHtml = statsParts.join('  ·  ');

    // Topics
    const topics = (p.topics || []).slice(0, 4);
    let topicsHtml = topics.map(t =>
      `<span style="padding:2px 8px;border-radius:4px;font-size:0.7rem;background:#f0ebe2;color:var(--muted);">${escHtml(t)}</span>`
    ).join('');

    // Links
    const ghUrl = p.url || `https://github.com/${p.full_name}`;
    let linksHtml = `<a href="${ghUrl}" target="_blank" class="hover-link" style="color:var(--muted);font-size:0.8rem;">GitHub &#8599;</a>`;
    if (p.hn_url) linksHtml += `<a href="${p.hn_url}" target="_blank" class="hover-link" style="color:#d4453b;font-size:0.8rem;margin-left:12px;">HN &#8599;</a>`;
    if (p.reddit_posts && p.reddit_posts[0] && p.reddit_posts[0].url) linksHtml += `<a href="${p.reddit_posts[0].url}" target="_blank" class="hover-link" style="color:#c7943c;font-size:0.8rem;margin-left:12px;">Reddit &#8599;</a>`;

    const name = p.name || p.full_name || '';

    return `
      <div class="card p-5 fade-in ${stagger}">
        <div class="flex items-start gap-4">
          <span class="rank-circle ${rankClass}">${i + 1}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap mb-1.5">
              <a href="${ghUrl}" target="_blank" class="text-base font-semibold hover-link" style="color: var(--ink);">
                ${escHtml(name)}
              </a>
              ${isTreasure ? '<span class="treasure-badge text-xs px-1.5 py-0.5 rounded-full shrink-0">宝藏</span>' : ''}
              ${p.language ? `<span class="text-xs shrink-0" style="color: var(--muted);">${escHtml(p.language)}</span>` : ''}
            </div>
            <p class="text-sm mb-2 leading-relaxed" style="color: #5c5048; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${escHtml(p.description || '')}</p>
            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs mb-2" style="color: var(--muted);">
              ${statsHtml}
            </div>
            <div class="flex items-center gap-2 flex-wrap">
              ${topicsHtml}
              ${linksHtml}
            </div>
          </div>
          <div class="text-right shrink-0 ml-2">
            <div class="text-2xl font-bold score-text display-font">${p.heat_score || '?'}</div>
            <div class="text-xs" style="color: var(--muted);">热度</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Water Insights Rendering ──
function renderWaterInsights() {
  const summaryEl = document.getElementById('waterSummary');
  const recsEl = document.getElementById('waterRecommendations');

  if (!waterData || !waterData.recommendations || waterData.recommendations.length === 0) {
    summaryEl.innerHTML = '<span style="color: var(--muted);">暂无足够数据生成水利行业建议</span>';
    recsEl.innerHTML = '';
    return;
  }

  summaryEl.textContent = waterData.summary || '';

  recsEl.innerHTML = waterData.recommendations.map((rec, idx) => {
    const projectsNames = (rec.hot_projects || []).map(p => p.name).join(', ');
    const scenarios = (rec.water_scenarios || []).slice(0, 4);
    const collapsed = idx > 1 ? 'collapsed' : '';

    return `
      <div class="card p-4" style="background: rgba(255,255,255,0.7);">
        <div class="flex items-center justify-between cursor-pointer" onclick="
          const content=this.nextElementSibling;
          const icon=this.querySelector('.expand-icon');
          const collapsed=content.classList.toggle('hidden');
          icon.textContent=collapsed?'▼':'▲';
        ">
          <h4 class="font-semibold text-sm" style="color: #1e4a5f;">
            ${escHtml(rec.tech_direction)}
            <span class="text-xs font-normal ml-2" style="color: var(--muted);">${escHtml(projectsNames || '—')}</span>
          </h4>
          <span class="expand-icon text-xs" style="color: var(--muted);">${idx > 1 ? '▼' : '▲'}</span>
        </div>
        <div class="expand-content ${collapsed ? 'hidden' : ''} mt-2">
          <p class="text-sm mb-3 leading-relaxed" style="color: #3a5a68;">${escHtml(rec.suggestion || '')}</p>
          <div class="flex flex-wrap gap-1.5 mb-3">
            ${scenarios.map(s => `<span style="padding:3px 10px;border-radius:100px;font-size:0.7rem;background:rgba(30,74,95,0.08);color:#1e4a5f;font-weight:500;">${escHtml(s)}</span>`).join('')}
          </div>
          <div class="hairline pt-3 flex gap-4">
            ${(rec.hot_projects || []).map(p =>
              `<a href="${escHtml(p.url)}" target="_blank" class="text-xs hover-link" style="color: var(--muted);">
                ${escHtml(p.name)} &middot; ${fmtNum(p.stars)} stars
              </a>`
            ).join('')}
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Utils ──
function fmtNum(n) {
  if (!n) return '0';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return n.toLocaleString();
}

function escHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Init ──
(async function init() {
  const ok = await loadData('daily');
  if (ok) renderAll();
})();
</script>

</body>
